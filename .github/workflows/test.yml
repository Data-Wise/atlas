name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          if [ "${{ matrix.node-version }}" = "18" ]; then
            npm run test:unit -- --testPathIgnorePatterns=dashboard-ink
          else
            npm run test:unit
          fi

      - name: Run integration tests
        run: |
          if [ "${{ matrix.node-version }}" = "18" ]; then
            npm run test:integration -- --testPathIgnorePatterns=dashboard-ink
          else
            npm run test:integration
          fi

  dogfood-tests:
    name: Dogfood Tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test directories
        run: |
          mkdir -p ~/.atlas
          mkdir -p /tmp/atlas-test-projects

      - name: Initialize atlas config
        run: |
          echo '{"scanPaths":["/tmp/atlas-test-projects"]}' > ~/.atlas/config.json

      - name: Run dogfood tests
        run: |
          chmod +x test/dogfood-noninteractive.sh
          ./test/dogfood-noninteractive.sh
        env:
          TERM: xterm-256color

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Run E2E tests
        run: npm run test:e2e
