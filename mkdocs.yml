site_name: Atlas
site_description: Project state engine - registry, sessions, capture, and context management for ADHD-friendly workflow
site_url: https://data-wise.github.io/atlas/

repo_name: Data-Wise/atlas
repo_url: https://github.com/Data-Wise/atlas

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

exclude_docs: |
  internal/
  specs/
  planning/
  plans/
  reviews/
  prompts/
  superpowers/
  SPEC-*.md
  grill-*.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Data-Wise/atlas
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - What's New: WHAT-S-NEW.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Tutorial: TUTORIAL.md
    - Demos: DEMOS.md
  - User Guide:
    - Cheatsheet: CHEATSHEET.md
    - Quick Reference Card: REFCARD.md
    - Visual Features: user-guide/tutorials/visual-features.md
    - Cookbook: COOKBOOK.md
    - Workflows: WORKFLOWS.md
    - CLI Reference: CLI-REFERENCE.md
    - Configuration: CONFIGURATION.md
    - Research Registry: user-guide/tutorials/research-registry.md
    - Visual Guide: VISUAL-GUIDE.md
  - Architecture:
    - Overview: ARCHITECTURE.md
    - Diagrams: DIAGRAMS.md
    - Integrations: INTEGRATIONS.md
  - Developer:
    - API Guide: API-GUIDE.md
    - API Recipes: API-RECIPES.md
    - MCP Server: MCP-SERVER.md
    - Roadmap: ROADMAP.md
