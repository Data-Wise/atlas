site_name: Atlas
site_description: Project state engine - registry, sessions, capture, and context management for ADHD-friendly workflow
site_url: https://data-wise.github.io/atlas/

repo_name: Data-Wise/atlas
repo_url: https://github.com/Data-Wise/atlas

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

exclude_docs: |
  internal/
  specs/
  planning/
  plans/
  reviews/
  prompts/
  superpowers/
  SPEC-*.md
  grill-*.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Data-Wise/atlas
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/scroll-progress.js
  - assets/javascripts/reading-time.js
  - assets/javascripts/section-toc.js

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started:
    - Installation: getting-started/installation.md
    - Tutorial: TUTORIAL.md
    - Demos:
      - Gallery: DEMOS.md
      - Recording: demos/README.md
  - Guide:
    - ADHD Guide:
      - Introduction: user-guide/adhd-guide/index.md
      - Core Principles: user-guide/adhd-guide/core-principles.md
      - Quick Wins: user-guide/adhd-guide/quick-wins.md
      - Time Blindness: user-guide/adhd-guide/time-blindness.md
      - Hyperfocus Management: user-guide/adhd-guide/hyperfocus.md
      - Accessibility: user-guide/adhd-guide/accessibility.md
    - Tutorials:
      - Visual Features: user-guide/tutorials/visual-features.md
      - Research Registry: user-guide/tutorials/research-registry.md
    - Workflows:
      - Scenarios: user-guide/workflows/SCENARIOS.md
      - Core Workflows: user-guide/workflows/WORKFLOWS.md
      - Weekly Review: user-guide/workflows/WEEKLY-REVIEW.md
      - Multi-Project: user-guide/workflows/MULTI-PROJECT.md
      - Automation: user-guide/workflows/AUTOMATION.md
    - Cookbook: user-guide/cookbook/COOKBOOK.md
    - Visual Guide: VISUAL-GUIDE.md
    - SwiftBar: user-guide/swiftbar.md
    - .STATUS Schema: STATUS-SCHEMA.md
    - Configuration: CONFIGURATION.md
    - Migration Guide: user-guide/MIGRATION-GUIDE.md
    - Troubleshooting: user-guide/TROUBLESHOOTING.md
  - Reference:
    - CLI Reference: CLI-REFERENCE.md
    - Quick Reference Card: REFCARD.md
    - API Guide: API-GUIDE.md
    - API Recipes: API-RECIPES.md
    - MCP Server: MCP-SERVER.md
  - Architecture:
    - Overview: ARCHITECTURE.md
    - Diagrams: DIAGRAMS.md
  - Integrations: INTEGRATIONS.md
  - Changelog:
    - What's New: WHAT-S-NEW.md
    - Roadmap: ROADMAP.md
    - Design Proposal: WEB-DESIGN-PROPOSAL.md
    - Contributing: CONTRIBUTING.md
